[project]
name = "public-sentiment"
version = "0.1.0"
description = "Public sentiment analysis console with traceable reports and evidence graphs"
authors = [
    { name = "clins", email = "2984226707@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
mysql = ["PyMySQL[rsa]>=1.1.1,<2"]

[project.scripts]
public-sentiment = "public_sentiment.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
